<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>My colour card</title>
    
    <style>
        /*Universal Selector- Applies to everything on the page */
        * {
            font-size: 16 px;
        }
        /*Elemental Selectors */
        body {
             background-color: lightgrey;
        }

        h1 {
            color: darkblue;
        }

        h2{
            color:purple;
        }

        p{
            color:dimgrey;
        }

        /* Class Selector */
        .my-detail{
        color:darkgreen;
        font-weight: bold;

        }

        /* ID Selector */
        #my-card {
            background-color: lightcyan;

        }
            
        
    </style>
</head>
<body>
    <h1>My Colour Card</h1>
    <p style="color: crimson;">Hi! This is my very own Webpage</p>
    <div id="my-card">
        <h2>About Me</h2>
        <p class="my-detail">My Name is Himadree</p>
        <p class="my-detail">My favourite colour is Blue</p>
        <p class="my-detail">My favourite subject is Science</p>
        <p class="my-detail">My favourite food is Fried rice</p>
    </div>
    <h2>My Favourite Things</h2>
    <p>My Favourite Animal is Puppy</p>
    <p>My Favourite Sport is Basketball</p>
    <p>My Favourite Cartoon is Ninjago</p>

</body>
</html>
